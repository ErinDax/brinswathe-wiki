site_name: Brin's Wathe 百科
site_description: brinswathe（b-w）模组 Wiki —— BRIN 列车专属角色/机制/配置百科
site_url: https://ErinDax.github.io/brinswathe-wiki/
repo_url: https://github.com/ErinDax/brinswathe-wiki
repo_name: brinswathe-wiki

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - attr_list

plugins:
  - search

nav:
  - 更新内容: changelog.md
  - 简介: index.md
  - 角色:
    - 平民阵营:
      - 替身演员: roles/civilian/stunt_double.md
      - 灵媒: roles/civilian/medium.md
      - 合谋者: roles/civilian/eavesdropper.md
      - 生存专家: roles/civilian/watchman.md
      - 档案员: roles/civilian/archivist.md
      - 复仇者: roles/civilian/avenger.md
      - 变态: roles/civilian/stalker.md
      - 牛仔: roles/civilian/cowboy.md
      - 瓦伦西娜: roles/civilian/valencina.md
      - 安检员: roles/civilian/security_checker.md
    - 杀手阵营:
      - 傀儡师: roles/killer/puppeteer.md
      - 捕兽者: roles/killer/beast_trapper.md
      - 幻术师: roles/killer/illusionist.md
      - 狙击手: roles/killer/sniper.md
      - 拾骨师: roles/killer/boneharvester.md
      - 炸弹客: roles/killer/bomber.md
      - 张师: roles/killer/zhangshi.md
      - 入殓师: roles/killer/mortician.md
    - 杀手中立阵营:
      - 赎罪者: roles/killer-neutral/penitent.md
      - 恐怖分子: roles/killer-neutral/terrorist.md
      - 梦魇: roles/killer-neutral/nightmare.md
    - 独立中立阵营:
      - 狂战士: roles/independent-neutral/berserker.md
      - 代偿者: roles/independent-neutral/compensator.md
      - 赌徒: roles/independent-neutral/gambler.md
      - 策反者: roles/independent-neutral/conspirator.md
  - 词条: modifiers.md
  - 配置:
    - 可配置项: config.md
    - 命令: commands.md
    - 机制: mechanisms.md
