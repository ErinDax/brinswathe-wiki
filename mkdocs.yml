site_name: Brin's Wathe 百科
site_description: BrinsWathe 模组 Wiki —— BRIN 列车专属角色/机制/配置百科
site_url: https://ErinDax.github.io/brinswathe-wiki/
repo_url: https://github.com/ErinDax/brinswathe-wiki
repo_name: brinswathe-wiki

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - attr_list

plugins:
  - search

nav:
  - 首页: index.md
  - 模组简介: about.md
  - 角色: roles.md
  - 商店: shop.md
  - 配置: config.md
  - 命令: commands.md
  - 机制: mechanisms.md
